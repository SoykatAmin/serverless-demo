---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sam-unit-tests
  namespace: "bs-team-alpha-dev"
  labels:
    app.kubernetes.io/name: "serverless-demo"
    app.kubernetes.io/part-of: "serverless-demo"
    owner: so.amin
spec:
  description: Executes unit tests for the selected Lambda runtime.
  workspaces:
    - name: source
      description: Shared workspace containing repository source code.
  params:
    - name: runtime
      type: string
      default: "nodejs20.x"

  steps:
    - name: run-tests
      image: public.ecr.aws/sam/build-nodejs20.x:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        cd "$(workspaces.source.path)"

        echo "=================================================="
        echo " 1. Running Unit Tests for $(params.runtime)     "
        echo "=================================================="
        if [ -f "src/package.json" ]; then
          echo "Node.js runtime detected. Installing dependencies and executing test runner..."
          cd src
          npm install --no-audit --no-fund
          cd ..
          node --test tests/unit/*.mjs
        elif [ -f "src/requirements.txt" ]; then
          echo "Python runtime detected. Installing requirements and running pytest..."
          pip install -q -r src/requirements.txt -r tests/requirements-dev.txt
          pytest tests/
        else
          echo "No package.json or requirements.txt discovered. Proceeding."
        fi


---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sam-validate
  namespace: "bs-team-alpha-dev"
  labels:
    app.kubernetes.io/name: "serverless-demo"
    app.kubernetes.io/part-of: "serverless-demo"
    owner: so.amin
spec:
  description: Validates the SAM template syntax and lints CloudFormation resources with cfn-lint.
  workspaces:
    - name: source
  params:
    - name: template-file
      type: string
      default: "sam-template.yaml"

  steps:
    - name: validate-and-lint
      image: public.ecr.aws/sam/build-nodejs20.x:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        cd "$(workspaces.source.path)"

        echo "=================================================="
        echo " 2. Validating AWS SAM Template with cfn-lint     "
        echo "=================================================="
        export SAM_CLI_TELEMETRY=0

        # Configure cfn-lint to ignore deprecated runtime warning (W2531)
        cat << 'EOF' > .cfnlintrc.yaml
        ignore_checks:
          - W2531
        EOF

        sam validate -t "$(params.template-file)"
        echo "SAM template $(params.template-file) is valid and passed linting."


---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sam-build
  namespace: "bs-team-alpha-dev"
  labels:
    app.kubernetes.io/name: "serverless-demo"
    app.kubernetes.io/part-of: "serverless-demo"
    owner: so.amin
spec:
  description: Compiles serverless dependencies and prepares build artifacts.
  workspaces:
    - name: source
  params:
    - name: template-file
      type: string
      default: "sam-template.yaml"

  steps:
    - name: build-artifacts
      image: public.ecr.aws/sam/build-nodejs20.x:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        cd "$(workspaces.source.path)"

        echo "=================================================="
        echo " 3. Building AWS SAM Serverless Artifacts         "
        echo "=================================================="
        sam build -t "$(params.template-file)" --use-container=false
        echo "Artifacts built into .aws-sam/build/ directory."


---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sam-deploy
  namespace: "bs-team-alpha-dev"
  labels:
    app.kubernetes.io/name: "serverless-demo"
    app.kubernetes.io/part-of: "serverless-demo"
    owner: so.amin
spec:
  description: Deploys the SAM CloudFormation stack ensuring mandatory Owner=so.amin tags are propagated.
  workspaces:
    - name: source
  params:
    - name: stack-name
      type: string
      default: "serverless-demo-dev"
    - name: aws-region
      type: string
      default: "eu-south-1"
    - name: environment
      type: string
      default: "dev"
    - name: service-name
      type: string
      default: "serverless-demo"
    - name: owner-tag
      type: string
      default: "so.amin"
    - name: s3-bucket
      type: string
      default: "so-amin-idp-terraform-backend"
  results:
    - name: stack-name
      description: Name of the deployed CloudFormation stack.
    - name: aws-region
      description: Deployed AWS region.

  steps:
    - name: deploy-stack
      image: public.ecr.aws/sam/build-nodejs20.x:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -eu
        cd "$(workspaces.source.path)"

        echo "=================================================="
        echo " 4. Deploying AWS SAM Application Stack           "
        echo "=================================================="
        echo "Stack Name:     $(params.stack-name)"
        echo "AWS Region:     $(params.aws-region)"
        echo "Mandatory Tag:  Owner=$(params.owner-tag)"
        echo "S3 Bucket:      $(params.s3-bucket)"

        sam deploy \
          --template-file .aws-sam/build/template.yaml \
          --stack-name "$(params.stack-name)" \
          --region "$(params.aws-region)" \
          --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --s3-bucket "$(params.s3-bucket)" \
          --s3-prefix "$(params.service-name)" \
          --tags "Owner=$(params.owner-tag) Service=$(params.service-name) Environment=$(params.environment)"

        echo "$(params.stack-name)" > $(results.stack-name.path)
        echo "$(params.aws-region)" > $(results.aws-region.path)

        echo "=================================================="
        echo " Deployment complete! Verified Owner=so.amin tag  "
        echo "=================================================="

